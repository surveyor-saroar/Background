<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ডকুমেন্ট স্ক্যানিং - Dual Click & Background Music Stage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #0d4559 0%, #062430 60%, #031218 100%);
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }

        /* নেটওয়ার্ক নোড ব্যাকগ্রাউন্ড ক্যানভাস */
        #networkCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ঠিক মাঝখানে বর্ডার ও ব্যাকগ্রাউন্ড ফিল ছাড়া 16:9 স্টেজ */
        .stage-16-9 {
            position: relative;
            z-index: 10;
            aspect-ratio: 16 / 9;
            width: min(94vw, 1280px);
            max-height: 92vh;
            border: none;
            background: transparent;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        /* উপরের ১০টি সিনের প্রগ্রেস বার ও টাইমার */
        .stage-header {
            padding: 12px 20px 4px;
            z-index: 20;
        }

        .progress-bars {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }

        .progress-track {
            flex: 1;
            height: 3.5px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #facc15;
            transition: width 0.08s linear;
        }

        .status-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .timer-pill {
            background: rgba(3, 18, 24, 0.45);
            color: #e0f2fe;
            padding: 4px 11px;
            border-radius: 99px;
            font-size: 0.74rem;
            font-weight: 600;
        }

        /* মাঝখানের স্বচ্ছ সিন এরিয়া */
        .visual-viewport {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px 24px;
            text-align: center;
        }

        /* Alternating Shrink-and-Slide Exit (scale 0.65) + Simultaneous Entrance */
        .scene-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4px 24px;
            pointer-events: none;
            opacity: 0;
            filter: blur(10px);
            transition:
                opacity 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.56s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.58s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, filter, transform;
        }

        .scene-layer.enter-from-right {
            transform: translate3d(190px, 14px, 0) scale(0.76);
        }

        .scene-layer.enter-from-left {
            transform: translate3d(-190px, 14px, 0) scale(0.76);
        }

        .scene-layer.active {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
            pointer-events: auto;
        }

        .scene-layer.exiting-left {
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(-195px, -10px, 0) scale(0.65);
        }

        .scene-layer.exiting-right {
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(195px, -10px, 0) scale(0.65);
        }

        .scene-inner {
            width: 100%;
            max-width: 1040px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        /* উপরের তিনটি লেখা আরও ০.৫ ইঞ্চি (~48px) উপরে */
        .top-texts-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            transform: translateY(-48px);
            margin-bottom: -36px;
        }

        .scene-badge {
            display: inline-block;
            background: #facc15;
            color: #061820;
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 4px 14px;
            border-radius: 99px;
            opacity: 0;
            filter: blur(6px);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.05s;
        }

        .enter-from-right .scene-badge { transform: translate3d(55px, 8px, 0) scale(0.8); }
        .enter-from-left .scene-badge { transform: translate3d(-55px, 8px, 0) scale(0.8); }

        .scene-layer.active .scene-badge {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
        }

        .scene-layer.exiting-left .scene-badge {
            opacity: 0;
            filter: blur(6px);
            transform: translate3d(-110px, 0, 0) scale(0.65);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .scene-layer.exiting-right .scene-badge {
            opacity: 0;
            filter: blur(6px);
            transform: translate3d(110px, 0, 0) scale(0.65);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .scene-heading {
            font-size: clamp(1.25rem, 2.3vw, 1.9rem);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
            line-height: 1.3;
            opacity: 0;
            filter: blur(8px);
            transition: all 0.52s cubic-bezier(0.22, 1, 0.36, 1) 0.1s;
        }

        .enter-from-right .scene-heading { transform: translate3d(70px, 10px, 0) scale(0.86); }
        .enter-from-left .scene-heading { transform: translate3d(-70px, 10px, 0) scale(0.86); }

        .scene-layer.active .scene-heading {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
        }

        .scene-layer.exiting-left .scene-heading {
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(-130px, 0, 0) scale(0.65);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .scene-layer.exiting-right .scene-heading {
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(130px, 0, 0) scale(0.65);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .accent-highlight {
            position: relative;
            display: inline-block;
            color: #061820;
            text-shadow: none;
            padding: 1px 8px;
            z-index: 1;
        }

        .accent-highlight::before {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: #facc15;
            border-radius: 6px;
            z-index: -1;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.22s;
        }

        .scene-layer.active .accent-highlight::before {
            transform: scaleX(1);
        }

        .scene-subtext {
            font-size: clamp(0.85rem, 1.25vw, 1.02rem);
            color: rgba(240, 249, 255, 0.88);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
            max-width: 740px;
            opacity: 0;
            filter: blur(6px);
            transition: all 0.52s cubic-bezier(0.22, 1, 0.36, 1) 0.14s;
        }

        .enter-from-right .scene-subtext { transform: translate3d(60px, 10px, 0) scale(0.88); }
        .enter-from-left .scene-subtext { transform: translate3d(-60px, 10px, 0) scale(0.88); }

        .scene-layer.active .scene-subtext {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
        }

        .scene-layer.exiting-left .scene-subtext {
            opacity: 0;
            filter: blur(6px);
            transform: translate3d(-115px, 0, 0) scale(0.65);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .scene-layer.exiting-right .scene-subtext {
            opacity: 0;
            filter: blur(6px);
            transform: translate3d(115px, 0, 0) scale(0.65);
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* একদম বাম পাশে ছবির বক্স (শুধুমাত্র শেষ সিনে দেখানো হবে) */
        .content-row {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            align-items: stretch;
            margin-top: 6px;
        }

        .content-row.has-left-photo {
            grid-template-columns: 175px 1fr;
        }

        .left-photo-box {
            background: rgba(6, 36, 48, 0.5);
            border: 1.5px solid rgba(250, 204, 21, 0.45);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .rounded-photo-frame {
            width: 126px;
            height: 126px;
            border-radius: 26px;
            padding: 3px;
            background: linear-gradient(135deg, #facc15, rgba(250, 204, 21, 0.25));
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .rounded-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 23px;
            display: block;
            background: #072a38;
        }

        /* ভিন্ন সাইজের কার্ড গ্রিড */
        .cards-grid {
            position: relative;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 12px;
            align-items: stretch;
        }

        .info-card {
            position: relative;
            background: rgba(6, 36, 48, 0.44);
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 16px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            grid-column: span var(--span, 4);
            opacity: 0;
            filter: blur(8px);
            transition:
                opacity 0.54s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.54s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.56s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .enter-from-right .info-card {
            transform: translate3d(125px, 16px, 0) scale(0.78);
        }

        .enter-from-left .info-card {
            transform: translate3d(-125px, 16px, 0) scale(0.78);
        }

        .info-card.size-lg {
            background: rgba(10, 54, 72, 0.54);
            border-color: rgba(250, 204, 21, 0.55);
            padding: 18px 16px;
        }

        .info-card.size-sm {
            padding: 11px 8px;
        }

        .info-card:nth-child(1) { transition-delay: 0.1s; }
        .info-card:nth-child(2) { transition-delay: 0.16s; }
        .info-card:nth-child(3) { transition-delay: 0.22s; }
        .info-card:nth-child(4) { transition-delay: 0.28s; }

        .scene-layer.active .info-card {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
        }

        .scene-layer.exiting-left .info-card {
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(-165px, -8px, 0) scale(0.65);
            transition:
                opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .scene-layer.exiting-right .info-card {
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(165px, -8px, 0) scale(0.65);
            transition:
                opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* শেষ সিনে মাউস পয়েন্টার: প্রথমে রিং বেলে ক্লিক, তারপর শেয়ার অপশনে ক্লিক, শেষে ক্লিয়ার */
        .pointer-cursor {
            position: absolute;
            left: 52%;
            top: 42%;
            width: 34px;
            height: 34px;
            z-index: 35;
            pointer-events: none;
            opacity: 0;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.65));
        }

        .scene-layer.active .pointer-cursor {
            animation: dualClickPointer 3.4s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
        }

        .stage-16-9.paused .scene-layer.active .pointer-cursor {
            animation-play-state: paused;
        }

        @keyframes dualClickPointer {
            0% {
                opacity: 0;
                transform: translate3d(90px, -18px, 0) scale(1);
            }
            16% {
                opacity: 1;
                transform: translate3d(0px, 0px, 0) scale(1);
            }
            23% {
                opacity: 1;
                transform: translate3d(0px, 0px, 0) scale(0.82);
            }
            29% {
                opacity: 1;
                transform: translate3d(0px, 0px, 0) scale(1);
            }
            52% {
                opacity: 1;
                transform: translate3d(245px, 6px, 0) scale(1);
            }
            59% {
                opacity: 1;
                transform: translate3d(245px, 6px, 0) scale(0.82);
            }
            65% {
                opacity: 1;
                transform: translate3d(245px, 6px, 0) scale(1);
            }
            86% {
                opacity: 0.55;
                transform: translate3d(315px, -24px, 0) scale(0.95);
            }
            100% {
                opacity: 0;
                transform: translate3d(350px, -38px, 0) scale(0.85);
            }
        }

        .click-ripple {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid #facc15;
            transform: translate(-50%, -50%) scale(0.2);
            opacity: 0;
            pointer-events: none;
            z-index: 25;
        }

        .ripple-bell {
            left: 50%;
            top: 38%;
        }

        .scene-layer.active .ripple-bell {
            animation: ripplePulse 0.65s ease-out 1.15s forwards;
        }

        .ripple-share {
            left: 50%;
            top: 38%;
            border-color: #4ade80;
        }

        .scene-layer.active .ripple-share {
            animation: ripplePulse 0.65s ease-out 2.35s forwards;
        }

        .stage-16-9.paused .scene-layer.active .click-ripple {
            animation-play-state: paused;
        }

        @keyframes ripplePulse {
            0% {
                opacity: 0.95;
                transform: translate(-50%, -50%) scale(0.25);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2.6);
            }
        }

        /* রিং বেল থেকে পরিবর্তন হয়ে ফলো বাটন ভেসে ওঠা */
        .bell-state-wrapper {
            position: relative;
            width: 100%;
            min-height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bell-before-click {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: opacity 0.25s ease, transform 0.3s ease;
        }

        .bell-before-click.clicked-hide {
            opacity: 0;
            transform: scale(0.7);
            pointer-events: none;
            position: absolute;
        }

        .follow-pill-pop {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #facc15;
            color: #061820;
            font-weight: 800;
            font-size: 1.05rem;
            padding: 12px 24px;
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(250, 204, 21, 0.35);
            opacity: 0;
            transform: scale(0.55) translateY(10px);
            transition: opacity 0.32s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .follow-pill-pop.visible {
            display: inline-flex;
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* শেয়ার কার্ড ক্লিক হলে নিচের লেখা সবুজ কালারে পরিবর্তন */
        .share-target-card.share-clicked {
            border-color: rgba(74, 222, 128, 0.75);
            background: rgba(12, 64, 52, 0.55);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .share-desc-text {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.86);
            line-height: 1.35;
            transition: color 0.3s ease, transform 0.3s ease, font-weight 0.3s ease;
        }

        .share-desc-text.green-active {
            color: #4ade80;
            font-weight: 700;
            transform: scale(1.06);
        }

        /* বড় লাইভ অ্যানিমেটেড আইকন কন্টেইনার */
        .live-icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: rgba(250, 204, 21, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #facc15;
            position: relative;
        }

        .info-card.size-lg .live-icon-wrap {
            width: 92px;
            height: 92px;
            border-radius: 22px;
            background: rgba(250, 204, 21, 0.2);
        }

        .info-card.size-sm .live-icon-wrap {
            width: 58px;
            height: 58px;
            border-radius: 15px;
        }

        .live-svg {
            width: 46px;
            height: 46px;
            overflow: visible;
        }

        .info-card.size-lg .live-svg {
            width: 60px;
            height: 60px;
        }

        .info-card.size-sm .live-svg {
            width: 36px;
            height: 36px;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        @keyframes iconSpinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes iconPulseScale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.13); }
        }

        @keyframes scanBeamMove {
            0%, 100% { transform: translateY(-9px); opacity: 0.95; }
            50% { transform: translateY(10px); opacity: 0.45; }
        }

        @keyframes plusPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.16) rotate(90deg); }
        }

        @keyframes cropExpand {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.09); }
        }

        @keyframes checkDraw {
            0% { stroke-dashoffset: 36; }
            50%, 100% { stroke-dashoffset: 0; }
        }

        .anim-float { animation: iconFloat 2.1s ease-in-out infinite; }
        .anim-spin { transform-origin: center; animation: iconSpinSlow 6s linear infinite; }
        .anim-pulse { transform-origin: center; animation: iconPulseScale 1.8s ease-in-out infinite; }
        .anim-scan-beam { animation: scanBeamMove 1.6s ease-in-out infinite; }
        .anim-plus { transform-origin: center; animation: plusPulse 2.2s ease-in-out infinite; }
        .anim-crop { transform-origin: center; animation: cropExpand 2s ease-in-out infinite; }
        .anim-check { stroke-dasharray: 36; stroke-dashoffset: 0; animation: checkDraw 2.2s ease-in-out infinite; }

        .stage-16-9.paused .anim-float,
        .stage-16-9.paused .anim-spin,
        .stage-16-9.paused .anim-pulse,
        .stage-16-9.paused .anim-scan-beam,
        .stage-16-9.paused .anim-plus,
        .stage-16-9.paused .anim-crop,
        .stage-16-9.paused .anim-check {
            animation-play-state: paused;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fef08a;
        }

        .info-card.size-lg .card-title { font-size: 1.08rem; }
        .info-card.size-sm .card-title { font-size: 0.84rem; }

        .card-desc {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.86);
            line-height: 1.35;
        }

        .info-card.size-lg .card-desc { font-size: 0.86rem; }
        .info-card.size-sm .card-desc { font-size: 0.72rem; }

        /* ১টি নিচের কারাওকে + টাইপিং অ্যাকসেন্ট ক্যাপশন বক্স */
        .karaoke-box {
            margin: 0 24px 14px;
            padding: 10px 18px;
            border-radius: 12px;
            background: rgba(3, 18, 24, 0.42);
            text-align: center;
            z-index: 15;
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(0, 16px, 0) scale(0.95);
            transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.32s;
        }

        .stage-16-9.ready .karaoke-box {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
        }

        .karaoke-caption {
            font-size: clamp(1.05rem, 1.95vw, 1.62rem);
            font-weight: 700;
            line-height: 1.5;
            min-height: 2.6rem;
            display: flex;

            padding: 2px 7px;

            background: transparent;
            z-index: 1;
            transition: color 0.12s ease, transform 0.16s ease;
            display: inline-block;
        }

        .k-word::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #facc15;
            border-radius: 6px;
            z-index: -1;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .k-word.spoken { color: #ffffff; }

        .k-word.spoken::after {
            transform: scaleX(1);
            height: 4px;
            top: auto;
            bottom: 0;
            border-radius: 99px;
        }

        .k-word.active {
            color: #061820;
            text-shadow: none;
            transform: scale(1.08) translateY(-2px);

    <script>

        /* ১. নেটওয়ার্ক নোড ব্যাকগ্রাউন্ড ক্যানভাস */
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, nodes = [];

        function initNetwork() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            nodes = [];
            const count = Math.floor((width * height) / 14500);

            for (let i = 0; i < count; i++) {
                const isLarge = Math.random() > 0.72;
                nodes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    radius: isLarge ? (Math.random() * 5 + 7) : (Math.random() * 3 + 3.5),
                    lineWidth: isLarge ? 2 : 1.4
                });
            }
        }

        function animateNetwork() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 145) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = 'rgba(56, 155, 188, 0.38)';
                        ctx.lineWidth = 1.15;
                        ctx.stroke();
                    }
                }
            }

            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                n.x += n.vx;
                n.y += n.vy;
                if (n.x < 0 || n.x > width) n.vx *= -1;
                if (n.y < 0 || n.y > height) n.vy *= -1;

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#072a38';
                ctx.fill();
                ctx.strokeStyle = 'rgba(65, 175, 210, 0.75)';
                ctx.lineWidth = n.lineWidth;
                ctx.stroke();
            }

            requestAnimationFrame(animateNetwork);
        }

        window.addEventListener('resize', initNetwork);
        initNetwork();

        /* ২. Web Audio API সাউন্ড ইঞ্জিন + 5% ব্যাকগ্রাউন্ড মিউজিক */
        class StageSoundEngine {
            constructor(candidates) {
                this.ctx = null;
                this.candidates = candidates;
                this.candidateIdx = 0;
                this.bgAudio = new Audio(this.candidates[0]);
                this.bgAudio.volume = 0.05; // 5% ভলিউম
                this.bgAudio.loop = true;
                this.bgAudio.preload = "auto";
                this.sequenceFinished = false;
                this.bindAudioFallback();
            }

            bindAudioFallback() {
                this.bgAudio.addEventListener('error', () => {
                    if (this.sequenceFinished) return;
                    this.candidateIdx += 1;
                    if (this.candidateIdx < this.candidates.length) {
                        this.bgAudio.src = this.candidates[this.candidateIdx];
                        this.bgAudio.load();
                        this.startBackgroundMusic();
                    }
                });
            }

            unlock() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.startBackgroundMusic();
            }

            startBackgroundMusic() {
                if (this.sequenceFinished) return;
                this.bgAudio.volume = 0.05;
                if (this.bgAudio.paused) {
                    const p = this.bgAudio.play();
                    if (p && typeof p.catch === 'function') {
                        p.catch(() => {});
                    }
                }
            }

            pauseBackgroundMusic() {
                this.bgAudio.pause();
            }

            stopBackgroundMusicAtEnd() {
                this.sequenceFinished = true;
                this.bgAudio.pause();
                this.bgAudio.currentTime = 0;
            }

            playSoftPop(step = 0) {
                if (this.sequenceFinished) return;
                this.unlock();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                const baseFreq = 360 + Math.min(step, 5) * 42;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.085);

                gain.gain.setValueAtTime(0.0008, now);
                gain.gain.linearRampToValueAtTime(0.09, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.11);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            }

            playMouseClick() {
                if (this.sequenceFinished) return;
                this.unlock();
                const now = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1450, now);
                osc.frequency.exponentialRampToValueAtTime(280, now + 0.045);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.24, now + 0.004);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.055);
            }

            playTransitionWhoosh() {
                if (this.sequenceFinished) return;
                this.unlock();
                const now = this.ctx.currentTime;
                const duration = 0.42;
                const sampleCount = Math.floor(this.ctx.sampleRate * duration);
                const buffer = this.ctx.createBuffer(1, sampleCount, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < sampleCount; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.Q.setValueAtTime(1.8, now);
                filter.frequency.setValueAtTime(240, now);
                filter.frequency.exponentialRampToValueAtTime(1150, now + duration * 0.55);
                filter.frequency.exponentialRampToValueAtTime(320, now + duration);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.0008, now);
                gain.gain.linearRampToValueAtTime(0.075, now + duration * 0.35);
                gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
                noise.stop(now + duration);
            }

            playSuccessChime() {
                if (this.sequenceFinished) return;
                this.unlock();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99];

                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startAt);

                    gain.gain.setValueAtTime(0.0008, startAt);
                    gain.gain.linearRampToValueAtTime(0.095, startAt + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.0008, startAt + 0.32);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startAt);
                    osc.stop(startAt + 0.34);
                });
            }

                ],
                caption: "প্রথমে আপনার ফোনে Google Drive অ্যাপটি ওপেন করুন।"
            },
            {
                badge: "SCENE 04 • STEP 02",
                headingBefore: "প্লাস (+) থেকে ",
                headingAccent: "Scan অপশন",
                headingAfter: " বেছে নিন",
                subtext: "নিচের প্লাস (+) আইকনে ট্যাপ করে Scan অপশনে ক্লিক করুন",
                duration: 5000,
                cards: [
                    { iconKey: "plus", title: "প্লাস (+) আইকন", desc: "নিচের কোণায় ট্যাপ", span: 4, size: "sm" },
                    { iconKey: "docScan", title: "Scan অপশন বেছে নিন", desc: "সরাসরি ক্যামেরা স্ক্যান মোড চালু হবে", span: 8, size: "lg" }

                caption: "এরপর নিচের প্লাস (+) আইকনে ক্লিক করুন এবং Scan অপশনটি বেছে নিন।"

            {

                headingAfter: "",
                subtext: "ভালো আলো ও পরিষ্কার ফ্রেমে কাগজটি স্থির রাখুন",
                duration: 5000,
                cards: [
                    { iconKey: "docScan", title: "ক্যামেরার সামনে ডকুমেন্ট", desc: "কাগজটি সমতল রেখে সোজা ফ্রেমে ধরুন", span: 7, size: "lg" },
                    { iconKey: "camera", title: "সঠিক ফ্রেমিং", desc: "স্পষ্ট লেখা", span: 5, size: "sm" }
                ],
                caption: "এবার যে ডকুমেন্টটি স্ক্যান করবেন, সেটি ক্যামেরার সামনে ধরুন।"
            },
            {
                badge: "SCENE 06 • AUTO DETECT",
                headingBefore: "ছবি তুলুন ও ",
                headingAccent: "অটো ডিটেক্ট",
                headingAfter: " দেখুন",
                subtext: "অ্যাপটি স্বয়ংক্রিয়ভাবে ডকুমেন্টের চারপাশ শনাক্ত করে নেবে",
                duration: 5000,
                cards: [
                    { iconKey: "camera", title: "ছবি তুলুন", desc: "শাটার চাপুন", span: 4, size: "sm" },
                    { iconKey: "crop", title: "স্বয়ংক্রিয় চারপাশ শনাক্তকরণ", desc: "AI নিজে থেকেই ডকুমেন্টের বর্ডার ধরে নেবে", span: 8, size: "lg" }
                ],
                caption: "ক্যামেরা দিয়ে ছবি তুলুন। অ্যাপটি স্বয়ংক্রিয়ভাবে ডকুমেন্টের চারপাশ শনাক্ত করে নেবে।"
            },
            {
                badge: "SCENE 07 • CROP & FILTER",
                headingBefore: "প্রয়োজনমতো ",
                headingAccent: "Crop ও ফিল্টার",
                headingAfter: " ব্যবহার করুন",
                subtext: "চারপাশ কেটে নিন এবং কালার বা ব্ল্যাক অ্যান্ড হোয়াইট ফিল্টার দিন",
                duration: 5000,
                cards: [
                    { iconKey: "crop", title: "Crop টুল", desc: "চারপাশ নিখুঁত করুন", span: 4, size: "md" },
                    { iconKey: "filter", title: "কালার ও B&W ফিল্টার", desc: "প্রয়োজন অনুযায়ী সেরা লুক দিন", span: 5, size: "lg" },
                    { iconKey: "bolt", title: "ক্লিয়ার ভিউ", desc: "সহজে পঠনযোগ্য", span: 3, size: "sm" }
                ],
                caption: "প্রয়োজনে ছবির চারপাশ Crop করে নিন এবং কালার বা ব্ল্যাক অ্যান্ড হোয়াইট ফিল্টার ব্যবহার করুন।"
            },
            {
                badge: "SCENE 08 • SAVE",
                headingBefore: "সব ঠিক থাকলে ",
                headingAccent: "Save বাটনে",
                headingAfter: " ক্লিক করুন",
                subtext: "এক ক্লিকেই আপনার ডকুমেন্টটি সংরক্ষিত হয়ে যাবে",
                duration: 5000,
                cards: [
                    { iconKey: "docScan", title: "প্রিভিউ চেক", desc: "লেখাগুলো ঠিক আছে কি না দেখুন", span: 4, size: "sm" },
                    { iconKey: "save", title: "Save বাটনে ক্লিক", desc: "ডকুমেন্ট সাথে সাথে সেভ হয়ে যাবে", span: 8, size: "lg" }
                ],
                caption: "সবকিছু ঠিক থাকলে Save বাটনে ক্লিক করুন।"
            },
            {
                badge: "SCENE 09 • PDF & SHARE",
                headingBefore: "তৈরি হবে ",
                headingAccent: "PDF ফাইল",
                headingAfter: " ও শেয়ারিং",
                subtext: "WhatsApp, Messenger কিংবা ইমেইলে মুহূর্তেই পাঠাতে পারবেন",
                duration: 5000,
                cards: [
                    { iconKey: "pdf", title: "রেডি PDF ফাইল", desc: "ডকুমেন্ট স্বয়ংক্রিয়ভাবে PDF-এ রূপান্তর হবে", span: 6, size: "lg" },
                    { iconKey: "share", title: "মেসেজ ও চ্যাট", desc: "দ্রুত শেয়ার", span: 3, size: "sm" },
                    { iconKey: "bolt", title: "ইমেইল সেন্ড", desc: "সহজে পাঠান", span: 3, size: "sm" }
                ],
                caption: "ব্যস! আপনার ডকুমেন্টটি PDF ফাইলে তৈরি হয়ে যাবে। এখন চাইলে WhatsApp, Messenger কিংবা ইমেইলে পাঠাতে পারবেন।"
            },
            {
                badge: "SCENE 10 • ENDING",
                headingBefore: "সহজ ট্রিকটি কাজে লাগান ও ",
                headingAccent: "সঙ্গে থাকুন",
                headingAfter: "",
                subtext: "এমন আরও টিপস পেতে পেজটি ফলো করে সংঙ্গে থাকুন",
                duration: 5000,
                isEnding: true,
                cards: [
                    { iconKey: "bolt", title: "কয়েক সেকেন্ডেই", desc: "দ্রুত স্ক্যান", span: 3, size: "sm" },
                    { iconKey: "bell", title: "পেজ ফলো করে সঙ্গে থাকুন", desc: "নতুন AI ও টেক টিপস সবার আগে পেতে যুক্ত থাকুন", span: 6, size: "lg", hasBellToFollow: true },
                    { iconKey: "share", title: "শেয়ার করুন", desc: "উপকারী ট্রিক", span: 3, size: "sm", isShareTarget: true }
                ],
                caption: "মাত্র কয়েক সেকেন্ডেই ডকুমেন্ট স্ক্যান করার এই সহজ ট্রিকটি কাজে লাগান। এমন আরও টিপস পেতে পেজটি ফলো করে সংঙ্গে থাকুন"
            }
        ];

        const ANIMATION_DURATION = scenes.reduce((sum, s) => sum + s.duration, 0);
        const TOTAL_TIMELINE_MS = ANIMATION_DURATION + EXTRA_HOLD_MS;

        const stage169 = document.getElementById('stage169');
        const progressBarsEl = document.getElementById('progressBars');
        const visualViewport = document.getElementById('visualViewport');
        const karaokeCaption = document.getElementById('karaokeCaption');
        const timerPill = document.getElementById('timerPill');
        const touchFeedback = document.getElementById('touchFeedback');

        let currentSceneIndex = 0;
        let activeLayerEl = null;
        let isPlaying = true;
        let elapsedInScene = 0;
        let totalElapsedMs = 0;
        let lastTimestamp = null;
        let popTimers = [];
        let feedbackTimeout = null;
        let preExitTriggered = false;
        let sequenceCompleted = false;

        scenes.forEach(() => {
            const track = document.createElement('div');
            track.className = 'progress-track';
            const fill = document.createElement('div');
            fill.className = 'progress-fill';
            track.appendChild(fill);
            progressBarsEl.appendChild(track);
        });
        const progressFills = document.querySelectorAll('.progress-fill');

        function clearPopTimers() {
            popTimers.forEach((t) => clearTimeout(t));
            popTimers = [];
        }

        function getSceneFlowDirection(index) {
            return Math.floor(index / 2) % 2 === 0 ? 'left' : 'right';
        }

        function getPhotoBoxHTML(scene) {
            if (!scene.isEnding) return '';
            return `
                <div class="left-photo-box" id="userPhotoBox">
                    <div class="rounded-photo-frame">
                        <img src="${USER_PHOTO_URL}" alt="Saroar">
                    </div>
                </div>
            `;
        }

        function createSceneLayer(scene, enterDir) {
            const layer = document.createElement('div');
            layer.className = `scene-layer ${enterDir === 'left' ? 'enter-from-right' : 'enter-from-left'}`;

            const cardsHTML = scene.cards.map(c => {
                if (c.hasBellToFollow) {
                    return `
                        <div class="info-card size-${c.size || 'md'} bell-target-card" style="--span: ${c.span || 4};">
                            <span class="click-ripple ripple-bell"></span>
                            <div class="bell-state-wrapper">
                                <div class="bell-before-click" id="bellBeforeClick">
                                    <div class="live-icon-wrap">${LIVE_ICONS.bell}</div>
                                    <div class="card-title">${c.title}</div>
                                </div>
                                <div class="follow-pill-pop" id="followPillPop">
                                    <span>✓</span>
                                    <span>ফলো বাটন • ফলোড</span>
                                </div>
                            </div>
                            <div class="card-desc">${c.desc}</div>
                        </div>
                    `;
                }

                if (c.isShareTarget) {
                    return `
                        <div class="info-card size-${c.size || 'md'} share-target-card" id="shareTargetCard" style="--span: ${c.span || 4};">
                            <span class="click-ripple ripple-share"></span>
                            <div class="live-icon-wrap">${LIVE_ICONS[c.iconKey] || LIVE_ICONS.share}</div>
                            <div class="card-title">${c.title}</div>
                            <div class="share-desc-text" id="shareDescText">${c.desc}</div>
                        </div>
                    `;
                }

                return `
                    <div class="info-card size-${c.size || 'md'}" style="--span: ${c.span || 4};">
                        <div class="live-icon-wrap">${LIVE_ICONS[c.iconKey] || LIVE_ICONS.ai}</div>
                        <div class="card-title">${c.title}</div>
                        <div class="card-desc">${c.desc}</div>
                    </div>
                `;
            }).join('');

            const pointerHTML = scene.isEnding
                ? `<span class="pointer-cursor">${MOUSE_POINTER_SVG}</span>`
                : '';

            const rowClass = scene.isEnding ? 'content-row has-left-photo' : 'content-row';

            layer.innerHTML = `
                <div class="scene-inner">
                    <div class="top-texts-group">
                        <span class="scene-badge">${scene.badge}</span>
                        <h1 class="scene-heading">
                            ${scene.headingBefore}<span class="accent-highlight">${scene.headingAccent}</span>${scene.headingAfter}
                        </h1>
                        <p class="scene-subtext">${scene.subtext}</p>
                    </div>
                    <div class="${rowClass}">
                        ${getPhotoBoxHTML(scene)}
                        <div class="cards-grid">
                            ${pointerHTML}
                            ${cardsHTML}
                        </div>
                    </div>
                </div>
            `;
            return layer;
        }

        function triggerCurrentSceneExit() {
            if (!activeLayerEl || preExitTriggered) return;
            preExitTriggered = true;
            const exitDir = getSceneFlowDirection(currentSceneIndex);
            const exitingEl = activeLayerEl;
            exitingEl.classList.remove('active');
            exitingEl.classList.add(exitDir === 'left' ? 'exiting-left' : 'exiting-right');
            setTimeout(() => {
                if (exitingEl.parentNode) exitingEl.remove();
            }, 620);
        }

        function loadScene(index) {
            if (activeLayerEl && !preExitTriggered) {
                triggerCurrentSceneExit();
            }

            currentSceneIndex = index;
            elapsedInScene = 0;
            preExitTriggered = false;
            clearPopTimers();

            const scene = scenes[index];
            scene.timedWords = buildTimedWords(scene.caption);

            soundEngine.startBackgroundMusic();
            soundEngine.playTransitionWhoosh();

            const flowDir = getSceneFlowDirection(index);
            const newLayer = createSceneLayer(scene, flowDir);
            visualViewport.appendChild(newLayer);
            activeLayerEl = newLayer;

            stage169.classList.remove('ready');
            karaokeCaption.innerHTML = '';
            scene.timedWords.forEach((w) => {
                const span = document.createElement('span');
                span.className = 'k-word';
                span.textContent = w.text;
                karaokeCaption.appendChild(span);
            });

            const caret = document.createElement('span');
            caret.className = 'typing-caret';
            karaokeCaption.appendChild(caret);

            void newLayer.offsetWidth;

            requestAnimationFrame(() => {
                newLayer.classList.add('active');
                stage169.classList.add('ready');

                const totalItems = 2 + scene.cards.length;
                for (let i = 0; i < totalItems; i++) {
                    const delayMs = 80 + i * 48;
                    const timer = setTimeout(() => {
                        if (isPlaying && !sequenceCompleted) soundEngine.playSoftPop(i);
                    }, delayMs);
                    popTimers.push(timer);
                }

                /* শেষ সিনে ডাবল ক্লিক: ১ম ক্লিক রিং বেলে -> ফলো বাটন, ২য় ক্লিক শেয়ার অপশনে -> নিচের লেখা সবুজ */
                if (scene.isEnding) {
                    const firstClickTimer = setTimeout(() => {
                        if (!isPlaying || sequenceCompleted) return;
                        soundEngine.playMouseClick();

                        const bellBefore = newLayer.querySelector('#bellBeforeClick');
                        const followPop = newLayer.querySelector('#followPillPop');

                        if (bellBefore) bellBefore.classList.add('clicked-hide');
                        if (followPop) {
                            followPop.classList.add('visible');
                            requestAnimationFrame(() => {
                                followPop.style.opacity = '1';
                                followPop.style.transform = 'scale(1) translateY(0)';
                            });
                        }
                    }, 1150);

                    const secondClickTimer = setTimeout(() => {
                        if (!isPlaying || sequenceCompleted) return;
                        soundEngine.playMouseClick();

                        const shareCard = newLayer.querySelector('#shareTargetCard');
                        const shareDesc = newLayer.querySelector('#shareDescText');

                        if (shareCard) shareCard.classList.add('share-clicked');
                        if (shareDesc) shareDesc.classList.add('green-active');

                        const chimeTimer = setTimeout(() => {
                            if (isPlaying && !sequenceCompleted) soundEngine.playSuccessChime();
                        }, 120);
                        popTimers.push(chimeTimer);
                    }, 2350);

                    popTimers.push(firstClickTimer, secondClickTimer);
                }
            });

            progressFills.forEach((fill, i) => {
                fill.style.width = i < index ? '100%' : '0%';
            });
        }

        function tick(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            if (isPlaying && !sequenceCompleted) {
                totalElapsedMs = Math.min(totalElapsedMs + delta, TOTAL_TIMELINE_MS);
                const totalSec = Math.floor(totalElapsedMs / 1000);
                timerPill.textContent = `${String(totalSec).padStart(2, '0')}s / 55s`;

                const isLastScene = currentSceneIndex === scenes.length - 1;

                if (!isLastScene) {
                    const scene = scenes[currentSceneIndex];
                    elapsedInScene += delta;
                    const progress = Math.min(elapsedInScene / scene.duration, 1);
                    progressFills[currentSceneIndex].style.width = `${progress * 100}%`;

                    const wordEls = karaokeCaption.querySelectorAll('.k-word');
                    const caretEl = karaokeCaption.querySelector('.typing-caret');

                    scene.timedWords.forEach((w, idx) => {
                        if (progress >= w.start && progress <= w.end) {
                            wordEls[idx].classList.add('active');
                            wordEls[idx].classList.remove('spoken');
                            if (caretEl && wordEls[idx].nextSibling !== caretEl) {
                                wordEls[idx].after(caretEl);
                            }
                        } else if (progress > w.end) {
                            wordEls[idx].classList.remove('active');
                            wordEls[idx].classList.add('spoken');
                        } else {
                            wordEls[idx].classList.remove('active', 'spoken');
                        }
                    });

                    if (progress >= 0.89 && !preExitTriggered) {
                        triggerCurrentSceneExit();
                        const nextIndex = currentSceneIndex + 1;
                        setTimeout(() => {
                            if (isPlaying && !sequenceCompleted) loadScene(nextIndex);
                        }, 120);
                    } else if (progress >= 1 && !preExitTriggered) {
                        loadScene(currentSceneIndex + 1);
                    }
                } else {
                    const scene = scenes[currentSceneIndex];
                    elapsedInScene += delta;
                    const sceneProgress = Math.min(elapsedInScene / scene.duration, 1);
                    progressFills[currentSceneIndex].style.width = `${sceneProgress * 100}%`;

                    const wordEls = karaokeCaption.querySelectorAll('.k-word');
                    const caretEl = karaokeCaption.querySelector('.typing-caret');

                    scene.timedWords.forEach((w, idx) => {
                        if (sceneProgress >= w.start && sceneProgress <= w.end) {
                            wordEls[idx].classList.add('active');
                            wordEls[idx].classList.remove('spoken');
                            if (caretEl && wordEls[idx].nextSibling !== caretEl) {
                                wordEls[idx].after(caretEl);
                            }
                        } else if (sceneProgress > w.end) {
                            wordEls[idx].classList.remove('active');
                            wordEls[idx].classList.add('spoken');
                        } else {
                            wordEls[idx].classList.remove('active', 'spoken');
                        }
                    });

                    if (sceneProgress >= 1 && caretEl) {
                        caretEl.remove();
                    }

                    if (totalElapsedMs >= TOTAL_TIMELINE_MS) {
                        sequenceCompleted = true;
                        isPlaying = false;
                        soundEngine.stopBackgroundMusicAtEnd();
                        timerPill.textContent = `55s / 55s`;
                    }
                }
            }

            requestAnimationFrame(tick);
        }

        stage169.addEventListener('click', () => {
            if (sequenceCompleted) return;
            soundEngine.unlock();
            isPlaying = !isPlaying;
            stage169.classList.toggle('paused', !isPlaying);

            if (isPlaying) {
                soundEngine.startBackgroundMusic();
            } else {
                soundEngine.pauseBackgroundMusic();
            }

            touchFeedback.textContent = isPlaying ? '▶' : '⏸';
            touchFeedback.classList.add('show');
            clearTimeout(feedbackTimeout);
            feedbackTimeout = setTimeout(() => {
                touchFeedback.classList.remove('show');
            }, 500);
        });

        loadScene(0);
        requestAnimationFrame(tick);
    </script>
