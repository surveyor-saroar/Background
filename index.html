<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16:9 Transparent Karaoke Stage - 45deg Scan Transition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #0d4559 0%, #062430 60%, #031218 100%);
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }

        /* নেটওয়ার্ক নোড ব্যাকগ্রাউন্ড ক্যানভাস */
        #networkCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ঠিক মাঝখানে বর্ডার ও ব্যাকগ্রাউন্ড ফিল ছাড়া 16:9 স্টেজ */
        .stage-16-9 {
            position: relative;
            z-index: 10;
            aspect-ratio: 16 / 9;
            width: min(94vw, 1280px);
            max-height: 92vh;
            border: none;
            background: transparent;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        /* ৪৫ ডিগ্রি কোণে স্ক্যানিং লাইন অ্যানিমেশন */
        .scan-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #facc15, #fef08a, #facc15, transparent);
            box-shadow: 0 0 14px rgba(250, 204, 21, 0.85);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transform: translate(-115%, -115%) rotate(45deg);
        }

        .scan-line.scanning {
            animation: scanSweep45 1.15s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes scanSweep45 {
            0% {
                transform: translate(-115%, -115%) rotate(45deg);
                opacity: 0;
            }
            15% {
                opacity: 0.95;
            }
            85% {
                opacity: 0.95;
            }
            100% {
                transform: translate(15%, 15%) rotate(45deg);
                opacity: 0;
            }
        }

        /* উপরের প্রগ্রেস বার ও স্ট্যাটাস */
        .stage-header {
            padding: 14px 20px 6px;
            z-index: 20;
        }

        .progress-bars {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .progress-track {
            flex: 1;
            height: 3.5px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #facc15;
            transition: width 0.08s linear;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(3, 18, 24, 0.45);
            padding: 5px 12px;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #fef9c3;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #facc15;
            animation: pulse 1.4s infinite;
        }

        .stage-16-9.paused .pulse-dot {
            background: #94a3b8;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.55; }
        }

        /* মাঝখানের স্বচ্ছ স্লাইড ও পপ-আপ অ্যানিমেশন এরিয়া */
        .visual-viewport {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px 24px;
            text-align: center;
        }

        .slide-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(24px) scale(0.96);
            transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .slide-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .popup-chip {
            display: inline-block;
            background: #facc15;
            color: #091820;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 5px 14px;
            border-radius: 99px;
            transform: scale(0.6);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }

        .popup-chip.pop {
            transform: scale(1);
            opacity: 1;
        }

        .visual-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: rgba(250, 204, 21, 0.16);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.1rem;
            transform: scale(0.7);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.08s, opacity 0.3s ease 0.08s;
        }

        .visual-icon.pop {
            transform: scale(1);
            opacity: 1;
        }

        .slide-title {
            font-size: clamp(1.35rem, 2.6vw, 2.2rem);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
            line-height: 1.25;
        }

        /* স্বচ্ছ কারাওকে ক্যাপশন - হলুদ সলিড কালার হাইলাইট */
        .karaoke-container {
            padding: 12px 24px 22px;
            background: transparent;
            text-align: center;
            z-index: 15;
        }

        .karaoke-caption {
            font-size: clamp(1.35rem, 2.5vw, 2.15rem);
            font-weight: 700;
            line-height: 1.5;
            min-height: 3.4rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 8px 10px;
        }

        .k-word {
            color: rgba(255, 255, 255, 0.55);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            padding: 2px 8px;
            border-radius: 6px;
            background: transparent;
            transition: background-color 0.12s ease, color 0.12s ease, transform 0.15s ease;
            display: inline-block;
        }

        .k-word.spoken {
            color: #ffffff;
        }

        /* হলুদ সলিড কালার দিয়ে হাইলাইট */
        .k-word.active {
            background-color: #facc15;
            color: #061820;
            text-shadow: none;
            transform: scale(1.08) translateY(-2px);
        }

        .tap-hint {
            margin-top: 8px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.65);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
        }

        /* প্লে/পজ টাচ ফিডব্যাক */
        .touch-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(3, 18, 24, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.7rem;
            color: #facc15;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .touch-feedback.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <!-- নেটওয়ার্ক নোড ব্যাকগ্রাউন্ড ক্যানভাস -->
    <canvas id="networkCanvas"></canvas>

    <!-- ঠিক মাঝখানে বর্ডার ছাড়া 16:9 স্টেজ -->
    <main class="stage-16-9" id="stage169">
        <div class="scan-line" id="scanLine"></div>
        <div class="touch-feedback" id="touchFeedback">⏸</div>

        <header class="stage-header">
            <div class="progress-bars" id="progressBars"></div>
            <div class="status-row">
                <div class="status-badge">
                    <span class="pulse-dot"></span>
                    <span id="statusText">PLAYING</span>
                </div>
            </div>
        </header>

        <section class="visual-viewport">
            <div class="slide-card" id="slideCard">
                <span class="popup-chip" id="popupChip"></span>
                <div class="visual-icon" id="visualIcon"></div>
                <h2 class="slide-title" id="slideTitle"></h2>
            </div>
        </section>

        <footer class="karaoke-container">
            <div class="karaoke-caption" id="karaokeCaption"></div>
            <div class="tap-hint">স্ক্রিনে টাচ করে প্লে / পজ অটো-টগল করুন</div>
        </footer>
    </main>

    <script>
        /* ১. নেটওয়ার্ক নোড ব্যাকগ্রাউন্ড ক্যানভাস */
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, nodes = [];

        function initNetwork() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            nodes = [];
            const count = Math.floor((width * height) / 14500);

            for (let i = 0; i < count; i++) {
                const isLarge = Math.random() > 0.72;
                nodes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    radius: isLarge ? (Math.random() * 5 + 7) : (Math.random() * 3 + 3.5),
                    lineWidth: isLarge ? 2 : 1.4
                });
            }
        }

        function animateNetwork() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 145) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = 'rgba(56, 155, 188, 0.38)';
                        ctx.lineWidth = 1.15;
                        ctx.stroke();
                    }
                }
            }

            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                n.x += n.vx;
                n.y += n.vy;
                if (n.x < 0 || n.x > width) n.vx *= -1;
                if (n.y < 0 || n.y > height) n.vy *= -1;

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#072a38';
                ctx.fill();
                ctx.strokeStyle = 'rgba(65, 175, 210, 0.75)';
                ctx.lineWidth = n.lineWidth;
                ctx.stroke();
            }

            requestAnimationFrame(animateNetwork);
        }

        window.addEventListener('resize', initNetwork);
        initNetwork();
        animateNetwork();

        /* ২. স্লাইড ও কারাওকে ক্যাপশন ডেটা (সাউন্ড ছাড়া) */
        const slides = [
            {
                badge: "SCENE 01 • 45° SCAN",
                icon: "🔗",
                title: "স্মার্ট নেটওয়ার্ক আর্কিটেকচার",
                duration: 4400,
                words: [
                    { text: "প্রতিটি", start: 0.05, end: 0.19 },
                    { text: "নেটওয়ার্ক", start: 0.19, end: 0.36 },
                    { text: "নোড", start: 0.36, end: 0.50 },
                    { text: "স্বচ্ছভাবে", start: 0.50, end: 0.70 },
                    { text: "যুক্ত", start: 0.70, end: 0.84 },
                    { text: "থাকে", start: 0.84, end: 0.97 }
                ]
            },
            {
                badge: "SCENE 02 • POP-UP & KARAOKE",
                icon: "⚡",
                title: "হলুদ হাইলাইট কারাওকে অ্যানিমেশন",
                duration: 4600,
                words: [
                    { text: "স্লাইড,", start: 0.05, end: 0.20 },
                    { text: "স্ক্যান", start: 0.20, end: 0.36 },
                    { text: "ও", start: 0.36, end: 0.46 },
                    { text: "পপ-আপের", start: 0.46, end: 0.66 },
                    { text: "সাথে", start: 0.66, end: 0.80 },
                    { text: "কারাওকে", start: 0.80, end: 0.97 }
                ]
            }
        ];

        const stage169 = document.getElementById('stage169');
        const progressBarsEl = document.getElementById('progressBars');
        const slideCard = document.getElementById('slideCard');
        const popupChip = document.getElementById('popupChip');
        const visualIcon = document.getElementById('visualIcon');
        const slideTitle = document.getElementById('slideTitle');
        const karaokeCaption = document.getElementById('karaokeCaption');
        const scanLine = document.getElementById('scanLine');
        const statusText = document.getElementById('statusText');
        const touchFeedback = document.getElementById('touchFeedback');

        let currentSlideIndex = 0;
        let isPlaying = true;
        let elapsedInSlide = 0;
        let lastTimestamp = null;
        let popupTimeout = null;
        let feedbackTimeout = null;

        slides.forEach(() => {
            const track = document.createElement('div');
            track.className = 'progress-track';
            const fill = document.createElement('div');
            fill.className = 'progress-fill';
            track.appendChild(fill);
            progressBarsEl.appendChild(track);
        });
        const progressFills = document.querySelectorAll('.progress-fill');

        function loadSlide(index) {
            currentSlideIndex = index;
            elapsedInSlide = 0;
            const slide = slides[index];

            slideCard.classList.remove('active');
            popupChip.classList.remove('pop');
            visualIcon.classList.remove('pop');
            scanLine.classList.remove('scanning');
            void slideCard.offsetWidth;

            popupChip.textContent = slide.badge;
            visualIcon.textContent = slide.icon;
            slideTitle.textContent = slide.title;

            karaokeCaption.innerHTML = '';
            slide.words.forEach((w) => {
                const span = document.createElement('span');
                span.className = 'k-word';
                span.textContent = w.text;
                karaokeCaption.appendChild(span);
            });

            slideCard.classList.add('active');
            scanLine.classList.add('scanning');

            clearTimeout(popupTimeout);
            popupTimeout = setTimeout(() => {
                popupChip.classList.add('pop');
                visualIcon.classList.add('pop');
            }, 240);

            progressFills.forEach((fill, i) => {
                fill.style.width = i < index ? '100%' : '0%';
            });
        }

        function tick(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            if (isPlaying) {
                const slide = slides[currentSlideIndex];
                elapsedInSlide += delta;
                const progress = Math.min(elapsedInSlide / slide.duration, 1);

                progressFills[currentSlideIndex].style.width = `${progress * 100}%`;

                const wordEls = karaokeCaption.querySelectorAll('.k-word');
                slide.words.forEach((w, idx) => {
                    if (progress >= w.start && progress <= w.end) {
                        wordEls[idx].classList.add('active');
                        wordEls[idx].classList.remove('spoken');
                    } else if (progress > w.end) {
                        wordEls[idx].classList.remove('active');
                        wordEls[idx].classList.add('spoken');
                    } else {
                        wordEls[idx].classList.remove('active', 'spoken');
                    }
                });

                if (progress >= 1) {
                    const nextIndex = (currentSlideIndex + 1) % slides.length;
                    loadSlide(nextIndex);
                }
            }

            requestAnimationFrame(tick);
        }

        stage169.addEventListener('click', () => {
            isPlaying = !isPlaying;
            stage169.classList.toggle('paused', !isPlaying);
            statusText.textContent = isPlaying ? 'PLAYING' : 'PAUSED';

            touchFeedback.textContent = isPlaying ? '▶' : '⏸';
            touchFeedback.classList.add('show');
            clearTimeout(feedbackTimeout);
            feedbackTimeout = setTimeout(() => {
                touchFeedback.classList.remove('show');
            }, 500);
        });

        loadSlide(0);
        requestAnimationFrame(tick);
    </script>
</body>
</html>
