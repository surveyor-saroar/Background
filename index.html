<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16:9 Transparent Karaoke Stage - Web Audio SFX (No Progress Tick)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #0d4559 0%, #062430 60%, #031218 100%);
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }

        /* নেটওয়ার্ক নোড ব্যাকগ্রাউন্ড ক্যানভাস */
        #networkCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ঠিক মাঝখানে বর্ডার ও ব্যাকগ্রাউন্ড ফিল ছাড়া 16:9 স্টেজ */
        .stage-16-9 {
            position: relative;
            z-index: 10;
            aspect-ratio: 16 / 9;
            width: min(94vw, 1280px);
            max-height: 92vh;
            border: none;
            background: transparent;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        /* উপরের প্রগ্রেস বার ও স্ট্যাটাস */
        .stage-header {
            padding: 12px 20px 4px;
            z-index: 20;
        }

        .progress-bars {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .progress-track {
            flex: 1;
            height: 3.5px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #facc15;
            transition: width 0.08s linear;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(3, 18, 24, 0.45);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fef9c3;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #facc15;
            animation: pulse 1.4s infinite;
        }

        .stage-16-9.paused .pulse-dot {
            background: #94a3b8;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.55; }
        }

        /* সাউন্ড মিউট/আনমিউট টগল বাটন */
        .sound-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(3, 18, 24, 0.5);
            color: #fef08a;
            border: 1px solid rgba(250, 204, 21, 0.35);
            padding: 5px 12px;
            border-radius: 99px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
            z-index: 30;
        }

        .sound-toggle:hover {
            background: rgba(3, 18, 24, 0.75);
            transform: scale(1.04);
        }

        .sound-toggle.muted {
            color: #94a3b8;
            border-color: rgba(148, 163, 184, 0.3);
        }

        /* মাঝখানের স্বচ্ছ সিন এরিয়া (ক্রসফেড/ডিজলভ লেয়ারিংয়ের জন্য) */
        .visual-viewport {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px 24px;
            text-align: center;
        }

        /* ট্রানজিশন টাইপ: ক্রসফেড/ডিজলভ + পজিশন শিফট + স্কেল জুম + ফোকাস শিফট */
        .scene-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 6px 24px;
            pointer-events: none;

            opacity: 0;
            filter: blur(14px);
            transform: translate3d(38px, 22px, 0) scale(0.91);
            transition:
                opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, filter, transform;
        }

        .scene-layer.active {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
            pointer-events: auto;
        }

        .scene-layer.exiting {
            opacity: 0;
            filter: blur(16px);
            transform: translate3d(-38px, -18px, 0) scale(1.06);
        }

        .scene-inner {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* ১টি ব্যাজ (স্ট্যাগার ডিলে: 0.08s) */
        .scene-badge {
            display: inline-block;
            background: #facc15;
            color: #061820;
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 4px 14px;
            border-radius: 99px;
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(-16px, 10px, 0) scale(0.88);
            transition: all 0.52s cubic-bezier(0.22, 1, 0.36, 1) 0.08s;
        }

        .scene-layer.active .scene-badge {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
        }

        /* ১টি হেডিং (স্ট্যাগার ডিলে: 0.14s) */
        .scene-heading {
            font-size: clamp(1.25rem, 2.3vw, 1.9rem);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75);
            line-height: 1.25;
            opacity: 0;
            filter: blur(10px);
            transform: translate3d(18px, 12px, 0) scale(0.94);
            transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.14s;
        }

        .scene-layer.active .scene-heading {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
        }

        /* ১টি সাব-টেক্সট (স্ট্যাগার ডিলে: 0.18s) */
        .scene-subtext {
            font-size: clamp(0.85rem, 1.3vw, 1.05rem);
            color: rgba(240, 249, 255, 0.85);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
            max-width: 720px;
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(0, 14px, 0) scale(0.95);
            transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.18s;
        }

        .scene-layer.active .scene-subtext {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
        }

        /* মোট ৪টি কার্ড/বক্স গ্রিড (স্ট্যাগার ডিলে: 0.20s থেকে 0.32s) */
        .cards-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 6px;
        }

        .info-card {
            background: rgba(6, 36, 48, 0.38);
            border: 1px solid rgba(250, 204, 21, 0.28);
            border-radius: 14px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            opacity: 0;
            filter: blur(10px);
            transform: translate3d(0, 22px, 0) scale(0.9);
            transition:
                opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .info-card:nth-child(1) { transition-delay: 0.20s; transform: translate3d(-16px, 20px, 0) scale(0.9); }
        .info-card:nth-child(2) { transition-delay: 0.24s; transform: translate3d(-6px, 22px, 0) scale(0.9); }
        .info-card:nth-child(3) { transition-delay: 0.28s; transform: translate3d(6px, 22px, 0) scale(0.9); }
        .info-card:nth-child(4) { transition-delay: 0.32s; transform: translate3d(16px, 20px, 0) scale(0.9); }

        .scene-layer.active .info-card {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
        }

        .card-icon {
            font-size: 1.4rem;
        }

        .card-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: #fef08a;
        }

        .card-desc {
            font-size: 0.76rem;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.35;
        }

        /* ১টি নিচের কারাওকে ক্যাপশন বক্স */
        .karaoke-box {
            margin: 0 24px 16px;
            padding: 10px 18px;
            border-radius: 12px;
            background: rgba(3, 18, 24, 0.35);
            text-align: center;
            z-index: 15;
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(0, 16px, 0) scale(0.95);
            transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.32s;
        }

        .stage-16-9.ready .karaoke-box {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0) scale(1);
        }

        .karaoke-caption {
            font-size: clamp(1.15rem, 2.1vw, 1.75rem);
            font-weight: 700;
            line-height: 1.45;
            min-height: 2.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 6px 8px;
        }

        .k-word {
            color: rgba(255, 255, 255, 0.58);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            padding: 2px 7px;
            border-radius: 6px;
            background: transparent;
            transition: background-color 0.14s ease, color 0.14s ease, transform 0.16s ease;
            display: inline-block;
        }

        .k-word.spoken {
            color: #ffffff;
        }

        .k-word.active {
            background-color: #facc15;
            color: #061820;
            text-shadow: none;
            transform: scale(1.08) translateY(-2px);
        }

        .tap-hint {
            margin-top: 6px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* প্লে/পজ টাচ ফিডব্যাক */
        .touch-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(3, 18, 24, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.7rem;
            color: #facc15;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .touch-feedback.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <!-- নেটওয়ার্ক নোড ব্যাকগ্রাউন্ড ক্যানভাস -->
    <canvas id="networkCanvas"></canvas>

    <!-- ঠিক মাঝখানে বর্ডার ও ব্যাকগ্রাউন্ড ফিল ছাড়া 16:9 স্টেজ -->
    <main class="stage-16-9" id="stage169">
        <div class="touch-feedback" id="touchFeedback">⏸</div>

        <header class="stage-header">
            <div class="progress-bars" id="progressBars"></div>
            <div class="status-row">
                <div class="status-badge">
                    <span class="pulse-dot"></span>
                    <span id="statusText">PLAYING</span>
                </div>
                <button type="button" class="sound-toggle" id="soundToggleBtn" aria-label="Sound Toggle">
                    <span id="soundIcon">🔊</span>
                    <span id="soundLabel">Sound ON</span>
                </button>
            </div>
        </header>

        <!-- ক্রসফেড / ডিজলভ ও ফোকাস শিফট ভিউপোর্ট -->
        <section class="visual-viewport" id="visualViewport"></section>

        <!-- ১টি নিচের কারাওকে ক্যাপশন বক্স -->
        <footer class="karaoke-box" id="karaokeBox">
            <div class="karaoke-caption" id="karaokeCaption"></div>
            <div class="tap-hint">স্ক্রিনে টাচ করে প্লে / পজ অটো-টগল করুন</div>
        </footer>
    </main>

    <script>
        /* =====================================================================
           ১. নেটওয়ার্ক নোড ব্যাকগ্রাউন্ড ক্যানভাস
           ===================================================================== */
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, nodes = [];

        function initNetwork() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            nodes = [];
            const count = Math.floor((width * height) / 14500);

            for (let i = 0; i < count; i++) {
                const isLarge = Math.random() > 0.72;
                nodes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    radius: isLarge ? (Math.random() * 5 + 7) : (Math.random() * 3 + 3.5),
                    lineWidth: isLarge ? 2 : 1.4
                });
            }
        }

        function animateNetwork() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 145) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = 'rgba(56, 155, 188, 0.38)';
                        ctx.lineWidth = 1.15;
                        ctx.stroke();
                    }
                }
            }

            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                n.x += n.vx;
                n.y += n.vy;
                if (n.x < 0 || n.x > width) n.vx *= -1;
                if (n.y < 0 || n.y > height) n.vy *= -1;

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#072a38';
                ctx.fill();
                ctx.strokeStyle = 'rgba(65, 175, 210, 0.75)';
                ctx.lineWidth = n.lineWidth;
                ctx.stroke();
            }

            requestAnimationFrame(animateNetwork);
        }

        window.addEventListener('resize', initNetwork);
        initNetwork();
        animateNetwork();

        /* =====================================================================
           ২. Web Audio API সাউন্ড ইঞ্জিন (প্রোগ্রেস টিক ও ব্যাকগ্রাউন্ড অ্যাম্বিয়েন্স ছাড়া)
              - সফট পপ / কার্ড এন্ট্রি
              - ট্রানজিশন সুইপ / হুশ (ফিল্টার্ড নয়েজ)
              - সাকসেস / চেকমার্ক চিম
           ===================================================================== */
        class StageSoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            unlock() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggle() {
                this.unlock();
                this.enabled = !this.enabled;
                return this.enabled;
            }

            // ১. সফট পপ / কার্ড এন্ট্রি (ব্যাজ, হেডিং ও কার্ড স্ক্রিনে এলে)
            playSoftPop(step = 0) {
                if (!this.enabled) return;
                this.unlock();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                const baseFreq = 360 + Math.min(step, 5) * 42;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, now + 0.085);

                gain.gain.setValueAtTime(0.0008, now);
                gain.gain.linearRampToValueAtTime(0.09, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.11);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            }

            // ২. ট্রানজিশন সুইপ / হুশ (সিন পরিবর্তনের সময় সূক্ষ্ম ফিল্টার্ড নয়েজ)
            playTransitionWhoosh() {
                if (!this.enabled) return;
                this.unlock();
                const now = this.ctx.currentTime;
                const duration = 0.42;
                const sampleCount = Math.floor(this.ctx.sampleRate * duration);
                const buffer = this.ctx.createBuffer(1, sampleCount, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < sampleCount; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.Q.setValueAtTime(1.8, now);
                filter.frequency.setValueAtTime(240, now);
                filter.frequency.exponentialRampToValueAtTime(1150, now + duration * 0.55);
                filter.frequency.exponentialRampToValueAtTime(320, now + duration);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.0008, now);
                gain.gain.linearRampToValueAtTime(0.075, now + duration * 0.35);
                gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start(now);
                noise.stop(now + duration);
            }

            // ৩. সাকসেস / চেকমার্ক চিম (চক্র বা কমপ্লিশন সম্পন্ন হলে পজিটিভ কম্বিনেশন টোন)
            playSuccessChime() {
                if (!this.enabled) return;
                this.unlock();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99];

                notes.forEach((freq, idx) => {
                    const startAt = now + idx * 0.085;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, startAt);

                    gain.gain.setValueAtTime(0.0008, startAt);
                    gain.gain.linearRampToValueAtTime(0.095, startAt + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.0008, startAt + 0.32);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startAt);
                    osc.stop(startAt + 0.34);
                });
            }
        }

        const soundEngine = new StageSoundEngine();

        /* =====================================================================
           ৩. সিন ডেটা (৪টি কার্ড/বক্স, ১ ব্যাজ, ১ হেডিং, ১ সাব-টেক্সট ও কারাওকে ক্যাপশন)
           ===================================================================== */
        const scenes = [
            {
                badge: "SCENE 01 • OVERVIEW",
                heading: "স্মার্ট নেটওয়ার্ক ও স্ট্যাগার লেআউট",
                subtext: "ক্রসফেড, পজিশন শিফট, স্কেল জুম এবং ফোকাস শিফট ট্রানজিশন",
                duration: 3000,
                cards: [
                    { icon: "🔹", title: "কার্ড ০১", desc: "ক্রসফেড ও ডিজলভ" },
                    { icon: "🔸", title: "কার্ড ০২", desc: "পজিশন শিফট" },
                    { icon: "🔹", title: "কার্ড ০৩", desc: "স্কেল জুম মোশন" },
                    { icon: "🔸", title: "কার্ড ০৪", desc: "ফোকাস শিফট ব্লার" }
                ],
                words: [
                    { text: "প্রথম", start: 0.06, end: 0.22 },
                    { text: "সিনে", start: 0.22, end: 0.38 },
                    { text: "চারটি", start: 0.38, end: 0.56 },
                    { text: "কার্ড", start: 0.56, end: 0.74 },
                    { text: "সাজানো", start: 0.74, end: 0.95 }
                ]
            },
            {
                badge: "SCENE 02 • FOCUS & ZOOM",
                heading: "ফোকাস শিফট ও স্কেল জুম ট্রানজিশন",
                subtext: "ব্লার থেকে শার্প ফোকাস এবং হলুদ সলিড কালারে কারাওকে হাইলাইট",
                duration: 3000,
                cards: [
                    { icon: "🌫️", title: "ডিজলভ", desc: "স্মুথ অপাসিটি" },
                    { icon: "↔️", title: "শিফট", desc: "translateX / Y" },
                    { icon: "🔍", title: "জুম", desc: "ডাইনামিক স্কেল" },
                    { icon: "🎯", title: "ফোকাস", desc: "শার্প ক্লিয়ারিটি" }
                ],
                words: [
                    { text: "ফোকাস", start: 0.06, end: 0.24 },
                    { text: "শিফট", start: 0.24, end: 0.44 },
                    { text: "ও", start: 0.44, end: 0.56 },
                    { text: "কারাওকে", start: 0.56, end: 0.78 },
                    { text: "অ্যানিমেশন", start: 0.78, end: 0.96 }
                ]
            }
        ];

        const stage169 = document.getElementById('stage169');
        const progressBarsEl = document.getElementById('progressBars');
        const visualViewport = document.getElementById('visualViewport');
        const karaokeCaption = document.getElementById('karaokeCaption');
        const statusText = document.getElementById('statusText');
        const touchFeedback = document.getElementById('touchFeedback');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundLabel = document.getElementById('soundLabel');

        let currentSceneIndex = 0;
        let activeLayerEl = null;
        let isPlaying = true;
        let elapsedInScene = 0;
        let lastTimestamp = null;
        let popTimers = [];
        let feedbackTimeout = null;

        scenes.forEach(() => {
            const track = document.createElement('div');
            track.className = 'progress-track';
            const fill = document.createElement('div');
            fill.className = 'progress-fill';
            track.appendChild(fill);
            progressBarsEl.appendChild(track);
        });
        const progressFills = document.querySelectorAll('.progress-fill');

        function clearPopTimers() {
            popTimers.forEach((t) => clearTimeout(t));
            popTimers = [];
        }

        function createSceneLayer(scene) {
            const layer = document.createElement('div');
            layer.className = 'scene-layer';

            const cardsHTML = scene.cards.map(c => `
                <div class="info-card">
                    <div class="card-icon">${c.icon}</div>
                    <div class="card-title">${c.title}</div>
                    <div class="card-desc">${c.desc}</div>
                </div>
            `).join('');

            layer.innerHTML = `
                <div class="scene-inner">
                    <span class="scene-badge">${scene.badge}</span>
                    <h1 class="scene-heading">${scene.heading}</h1>
                    <p class="scene-subtext">${scene.subtext}</p>
                    <div class="cards-grid">${cardsHTML}</div>
                </div>
            `;
            return layer;
        }

        function loadScene(index) {
            currentSceneIndex = index;
            elapsedInScene = 0;
            clearPopTimers();

            const scene = scenes[index];
            soundEngine.playTransitionWhoosh();

            if (activeLayerEl) {
                const oldLayer = activeLayerEl;
                oldLayer.classList.remove('active');
                oldLayer.classList.add('exiting');
                setTimeout(() => {
                    if (oldLayer.parentNode) oldLayer.remove();
                }, 700);
            }

            const newLayer = createSceneLayer(scene);
            visualViewport.appendChild(newLayer);
            activeLayerEl = newLayer;

            stage169.classList.remove('ready');
            karaokeCaption.innerHTML = '';
            scene.words.forEach((w) => {
                const span = document.createElement('span');
                span.className = 'k-word';
                span.textContent = w.text;
                karaokeCaption.appendChild(span);
            });

            void newLayer.offsetWidth;

            requestAnimationFrame(() => {
                newLayer.classList.add('active');
                stage169.classList.add('ready');

                const popDelays = [80, 140, 200, 240, 280, 320];
                popDelays.forEach((delayMs, idx) => {
                    const timer = setTimeout(() => {
                        if (isPlaying) soundEngine.playSoftPop(idx);
                    }, delayMs);
                    popTimers.push(timer);
                });
            });

            progressFills.forEach((fill, i) => {
                fill.style.width = i < index ? '100%' : '0%';
            });
        }

        function tick(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            if (isPlaying) {
                const scene = scenes[currentSceneIndex];
                elapsedInScene += delta;
                const progress = Math.min(elapsedInScene / scene.duration, 1);

                progressFills[currentSceneIndex].style.width = `${progress * 100}%`;

                const wordEls = karaokeCaption.querySelectorAll('.k-word');
                scene.words.forEach((w, idx) => {
                    if (progress >= w.start && progress <= w.end) {
                        wordEls[idx].classList.add('active');
                        wordEls[idx].classList.remove('spoken');
                    } else if (progress > w.end) {
                        wordEls[idx].classList.remove('active');
                        wordEls[idx].classList.add('spoken');
                    } else {
                        wordEls[idx].classList.remove('active', 'spoken');
                    }
                });

                if (progress >= 1) {
                    const isCycleCompleted = currentSceneIndex === scenes.length - 1;
                    if (isCycleCompleted) {
                        soundEngine.playSuccessChime();
                    }
                    const nextIndex = (currentSceneIndex + 1) % scenes.length;
                    loadScene(nextIndex);
                }
            }

            requestAnimationFrame(tick);
        }

        stage169.addEventListener('click', () => {
            soundEngine.unlock();
            isPlaying = !isPlaying;
            stage169.classList.toggle('paused', !isPlaying);
            statusText.textContent = isPlaying ? 'PLAYING' : 'PAUSED';

            touchFeedback.textContent = isPlaying ? '▶' : '⏸';
            touchFeedback.classList.add('show');
            clearTimeout(feedbackTimeout);
            feedbackTimeout = setTimeout(() => {
                touchFeedback.classList.remove('show');
            }, 500);
        });

        soundToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isSoundOn = soundEngine.toggle();
            soundToggleBtn.classList.toggle('muted', !isSoundOn);
            soundIcon.textContent = isSoundOn ? '🔊' : '🔇';
            soundLabel.textContent = isSoundOn ? 'Sound ON' : 'Sound OFF';
            if (isSoundOn) soundEngine.playSoftPop(2);
        });

        loadScene(0);
        requestAnimationFrame(tick);
    </script>
</body>
</html>
