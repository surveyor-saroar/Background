<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নেটওয়ার্ক নোড ব্যাকগ্রাউন্ড</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* ছবির মতো ডার্ক সায়ান-নীল রেডিয়াল গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড */
            background: radial-gradient(circle at 50% 50%, #0d4559 0%, #062430 60%, #031218 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* ব্যাকগ্রাউন্ড ক্যানভাস */
        #networkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* নমুনা কন্টেন্ট বক্স */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .content-box {
            background: rgba(6, 36, 48, 0.72);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(58, 152, 184, 0.35);
            padding: 40px 30px;
            border-radius: 16px;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .content-box h1 {
            font-size: 2rem;
            color: #5bc8eb;
            margin-bottom: 12px;
        }

        .content-box p {
            color: #cde8f2;
            line-height: 1.6;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

    <canvas id="networkCanvas"></canvas>

    <div class="container">
        <div class="content-box">
            <h1>নেটওয়ার্ক ব্যাকগ্রাউন্ড</h1>
            <p>কোনো আলাদা ইমেজ ছাড়াই শুধুমাত্র কোডের মাধ্যমে আপনার ছবির মতো নেটওয়ার্ক নোড ও লাইন ডিজাইন তৈরি করা হয়েছে।</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let nodes = [];

        // সেটিংস (ইচ্ছেমতো পরিবর্তন করতে পারেন)
        const config = {
            nodeDensity: 14000,       // সংখ্যা কমালে নোড বাড়বে
            maxDistance: 145,         // কত দূরত্বের নোডগুলোর মধ্যে লাইন যুক্ত হবে
            lineColor: 'rgba(56, 155, 188, 0.42)',
            circleStroke: 'rgba(65, 175, 210, 0.75)',
            circleFill: '#
